<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleLinks</title>
  <link rel="stylesheet" href="links.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script defer src="links.js"></script>
</head>
<body>
  <main>
    <form id="link-form" hidden>
      <label>Link type
        <select id="kind">
          <option value="revit">Revit project (.rvt)</option>
          <option value="web">Website</option>
        </select>
      </label>
      <label>Name <input id="label" maxlength="80" required placeholder="e.g. Silver Moon model"></label>
      <label id="url-field" hidden>Website address
        <input id="url" type="url" maxlength="1000" placeholder="https://example.com">
      </label>
      <button type="submit" class="primary">Add link</button>
    </form>
    <p id="status" role="status" aria-live="polite">Loading links…</p>
    <ul id="links" aria-label="Card links"></ul>
  </main>
</body>
</html>
